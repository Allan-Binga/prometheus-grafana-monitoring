global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prestige-hostel-local'
    metrics_path: /prestige-hostel/v1/metrics
    static_configs:
      - targets: ['host-gateway:5900'] #PM2 instance
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: localhost:5900  # Match what the dashboard expects

  # Example second app running on the host at port 6000 (disabled).
  # Uncomment this job when the app exposes its /metrics endpoint.
  # - job_name: 'second-app-local'
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ['host-gateway:6000']
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: instance
  #       replacement: localhost:6000

  # Linux host CPU, memory, disks, and network metrics.
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host-gateway:9100']


  