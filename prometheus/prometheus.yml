global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Linux host CPU, memory, disks, and network metrics.
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host-gateway:9100']

  # Node Applications
  - job_name: 'prestige-hostel-local'
    metrics_path: /prestige-hostel/v1/metrics
    static_configs:
      - targets: ['host-gateway:5900'] #PM2 instance
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: localhost:5900  # Match what the dashboard expects
  
  - job_name: 'murandi-local'
    metrics_path: /murandi/v1/metrics
    static_configs:
      - targets: ['host-gateway:5700'] #PM2 instance
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: localhost:5700  # Match what the dashboard expects


  